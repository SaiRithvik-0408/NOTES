version: '3.8'

services:
  app:
    build: .
    ports:
      - "5173:5173"
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://nexus:nexus_password@postgres:5432/nexus_notes
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_password
      POSTGRES_DB: nexus_notes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d

volumes:
  postgres_data:
