<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0B0F19" />
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="url(#nexusGrad)" stroke-width="1.5" stroke-opacity="0.4" />
  <!-- Central Nexus node and interconnected branches -->
  <path d="M50 24L74 38V66L50 80L26 66V38L50 24Z" stroke="url(#nexusGrad)" stroke-width="3" stroke-linejoin="round" fill="none" />
  <circle cx="50" cy="52" r="9" fill="url(#nexusGrad)" filter="url(#glow)" />
  <circle cx="50" cy="24" r="4.5" fill="#6366F1" />
  <circle cx="74" cy="38" r="4.5" fill="#8B5CF6" />
  <circle cx="74" cy="66" r="4.5" fill="#EC4899" />
  <circle cx="50" cy="80" r="4.5" fill="#6366F1" />
  <circle cx="26" cy="66" r="4.5" fill="#8B5CF6" />
  <circle cx="26" cy="38" r="4.5" fill="#EC4899" />
  <!-- Connecting rays to center -->
  <line x1="50" y1="52" x2="50" y2="24" stroke="url(#nexusGrad)" stroke-width="2" stroke-dasharray="2 2" />
  <line x1="50" y1="52" x2="74" y2="38" stroke="url(#nexusGrad)" stroke-width="2" stroke-dasharray="2 2" />
  <line x1="50" y1="52" x2="74" y2="66" stroke="url(#nexusGrad)" stroke-width="2" stroke-dasharray="2 2" />
  <line x1="50" y1="52" x2="50" y2="80" stroke="url(#nexusGrad)" stroke-width="2" stroke-dasharray="2 2" />
  <line x1="50" y1="52" x2="26" y2="66" stroke="url(#nexusGrad)" stroke-width="2" stroke-dasharray="2 2" />
  <line x1="50" y1="52" x2="26" y2="38" stroke="url(#nexusGrad)" stroke-width="2" stroke-dasharray="2 2" />
</svg>
